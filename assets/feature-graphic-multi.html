<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; background:#05070d; }
  .canvas {
    position:relative;
    width:1024px; height:500px;
    background:
      radial-gradient(620px 460px at 86% -12%, rgba(47,107,255,.36), transparent 65%),
      radial-gradient(520px 420px at 8% 96%, rgba(76,201,255,.16), transparent 68%),
      #05070d;
    font-family: Manrope, -apple-system, "Segoe UI", sans-serif;
    overflow:hidden;
  }
  .canvas::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at 14% 20%, #000 0%, transparent 60%);
    -webkit-mask-image: radial-gradient(circle at 14% 20%, #000 0%, transparent 60%);
  }

  .brand { position:absolute; left:44px; top:38px; display:flex; align-items:center; gap:11px; z-index:20; }
  .brand img { width:32px; height:32px; }
  .brand span { font-size:21px; font-weight:800; color:#e8edf7; letter-spacing:-.01em; }
  .tagline {
    position:absolute; left:44px; top:82px; z-index:20;
    font-size:15px; font-weight:500; color:#8ea0c2; letter-spacing:.01em;
  }

  .fan { position:absolute; inset:0; }
  .phone {
    position:absolute;
    width:150px; height:298px;
    border-radius:22px;
    background:#0b0f1a;
    border:3px solid #1c2740;
    box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02);
    overflow:hidden;
  }
  .phone img { width:100%; height:100%; object-fit:cover; object-position:top; }
  .phone.glow { box-shadow: 0 20px 50px rgba(0,0,0,.55), 0 0 46px rgba(76,201,255,.30); }
</style>
</head>
<body>
<div class="canvas">
  <div class="brand"><img src="valenox-mark-dark.svg"><span>Valenox</span></div>
  <div class="tagline">Food scanning &middot; heart rate &middot; medicines &middot; trends &middot; health score</div>
  <div class="fan" id="fan"></div>
</div>
<script>
const phones = [
  { src: "play_screenshots/home.png",             x: 300, y: 158, r: -12 },
  { src: "play_screenshots/scan.png",              x: 425, y: 128, r: -6  },
  { src: "play_screenshots/heartrate.png",         x: 550, y: 104, r: 0, glow:true },
  { src: "play_screenshots/trends_weekly_bpm.png", x: 675, y: 128, r: 6  },
  { src: "play_screenshots/medicine.png",          x: 800, y: 158, r: 12 },
];
const fan = document.getElementById("fan");
for (const p of phones) {
  const el = document.createElement("div");
  el.className = "phone" + (p.glow ? " glow" : "");
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";
  el.style.transform = `rotate(${p.r}deg)`;
  el.innerHTML = `<img src="${p.src}">`;
  fan.appendChild(el);
}
</script>
</body>
</html>
